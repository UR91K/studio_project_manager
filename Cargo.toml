[workspace]
members = [
    ".",
    "crates/vst-meta",
    "crates/vst",
]
resolver = "2"

[package]
name = "seula"
version = "0.2.0-alpha.1"
edition = "2021"
license = "AGPL-3.0-or-later"  # plus a section 7 exception, see LICENSE-EXCEPTIONS.md (ADR-0054)

[dependencies]
uuid = { version = "1.8.0", features = ["v4", "serde"] }
elementtree = "1.2.3"
flate2 = "1.0.30"
zune-inflate = "0.2.54"
colored = "3.0.0"
xml = "0.8.20"
quick-xml = "0.37.2"
tracing = "0.1"
tracing-appender = "0.2"     # Daily log files for the daemon (ADR-0071)
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }  # tracing-log bridges `log`-emitting deps (notify)
crc32fast = "1.4.0"
thiserror = "2.0.11"
hex = "0.4.3"
encoding_rs = "0.8.34"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.200", features = ["derive"] }
lazy_static = "1.4.0"
toml = "0.8.14"
dirs = "6.0.0"
once_cell = "1.19.0"
regex = "1.10.4"
parking_lot = "0.12.2"
walkdir = "2.5.0"
tempfile = "3.10.1"
terminal_size = "0.4.1"
rand = "0.8.5"
notify = "8.0.0"              # File system events
tokio = { version = "1.0", features = ["full"] }  # Async runtime
sha2 = "0.10"              # File hashing
chrono = { version = "0.4.39", features = ["serde"] }
# HTTP router (ADR-0024).
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
# Already in the tree via axum; direct only for ServeFile in the media handler.
tower = { version = "0.5", features = ["util"] }
mime = "0.3"
tokio-stream = "0.1"
async-trait = "0.1"
strum = "0.27.1"
strum_macros = "0.27.1"
tray-icon = "0.21"        # System tray functionality
png = "0.17"              # Decodes the tray icon (assets/tray-icon.png)

# CLI dependencies
clap = { version = "4.0", features = ["derive", "color"] }
rustyline = "10.0"        # Interactive readline functionality
comfy-table = "7.0"       # Beautiful table formatting
indicatif = "0.17"        # Progress bars
crossterm = "0.27"        # Terminal manipulation
csv = "1.3"               # CSV output support
unicode-width = "0.2"     # Unicode-aware string width calculation
serde_json = "1.0"        # JSON output support
sys-info = "0.9"          # System information

# Plugin scanning: types only. The `host` feature -- which links the VST2/VST3 hosts
# and loads plugin binaries -- is deliberately NOT enabled here. That work happens in
# the `vst-meta` worker subprocess; this process must never load a plugin.
vst-meta = { path = "crates/vst-meta", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
winreg = "0.52"

# Smaller target folders: backtraces keep file and line, debuggers lose locals.
[profile.dev]
debug = "line-tables-only"
