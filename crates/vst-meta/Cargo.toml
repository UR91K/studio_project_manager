[package]
name = "vst-meta"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"  # not the root AGPL: the plugin scanners stay MPL (ADR-0054)

# The `host` feature gates everything that links a VST host and touches plugin
# binaries. The parent process depends on this crate with `default-features = false`
# so it can share the wire types without pulling `vst`/`vst3-host` into an address
# space that must never load a plugin.
[features]
default = ["host"]
host = ["dep:libloading", "dep:vst", "dep:vst3-host", "dep:clap", "dep:windows-sys"]

[[bin]]
name = "vst-meta"
path = "src/main.rs"
required-features = ["host"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

libloading = { version = "0.7", optional = true }
vst = { path = "../vst", version = "0.4.0", features = ["disable_deprecation_warning"], optional = true } # vendored + patched, see ADR-0079
vst3-host = { version = "0.9.0", optional = true } # Standard VST3 host and discovery engine
clap = { version = "4", features = ["derive"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_Debug"], optional = true }
