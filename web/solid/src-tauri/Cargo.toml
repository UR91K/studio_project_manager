# Deliberately NOT a member of the root workspace (ADR-0048): Tauri's dependency tree is
# large, and `cargo build/test --workspace` should not compile it. Own lockfile; the target directory is shared (web/.cargo/config.toml).
[package]
name = "seula-shell-solid"
version = "0.2.0-alpha.2"
edition = "2021"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The native folder dialog, used only inside the `pick_folders` command (ADR-0073); its own
# permissions are not granted to the page.
tauri-plugin-dialog = "2"

# The snap-layout overlay (ADR-0057, src/snap.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]
